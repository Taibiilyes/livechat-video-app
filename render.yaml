services:
  - type: web
    name: livechat-video-app
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # Where the database files live. On the free plan the filesystem is
      # ephemeral (data is lost on every deploy/restart). To keep data,
      # upgrade the plan and attach a disk, then set DATA_DIR=/var/data:
      #   disk:
      #     name: livechat-data
      #     mountPath: /var/data
      #     sizeGB: 1
      # Admin dashboard login (/admin) — set real values in the Render dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: ./data
